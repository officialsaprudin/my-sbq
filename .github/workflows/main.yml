name: Build APK My SBQ

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract app-source.zip
        run: |
          python3 -c "import zipfile, os
          if os.path.exists('app-source.zip'):
              with zipfile.ZipFile('app-source.zip', 'r') as z:
                  for info in z.infolist():
                      p = os.path.join('app', info.filename.replace('\\\\', '/'))
                      if info.is_dir() or p.endswith('/'):
                          os.makedirs(p, exist_ok=True)
                      else:
                          os.makedirs(os.path.dirname(p), exist_ok=True)
                          with open(p, 'wb') as f:
                              f.write(z.read(info.filename))
          "

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Rename APK for Easy Download
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/release/app-release.apk output-apk/My-SBQ-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/My-SBQ-Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Android-My-SBQ
          path: output-apk/*.apk
